<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدافع دژ: نبرد بی‌پایان</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        body { background: #062319; color: #d4af37; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
        #game-container { width: 100%; max-width: 480px; height: 100vh; max-height: 850px; background: linear-gradient(135deg, #0a3a29 0%, #062319 100%); border: 3px solid #d4af37; box-shadow: 0 0 20px rgba(212, 175, 55, 0.4); display: flex; flex-direction: column; position: relative; overflow: hidden; }
        header { background: rgba(6, 35, 25, 0.95); border-bottom: 2px solid #d4af37; padding: 12px; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
        .stat-box { font-size: 14px; font-weight: bold; color: #d4af37; text-shadow: 1px 1px 2px #000; }
        #canvas-wrap { flex: 1; position: relative; background: #03150f; cursor: crosshair; }
        canvas { display: block; width: 100%; height: 100%; }
        footer { background: rgba(6, 35, 25, 0.95); border-top: 2px solid #d4af37; padding: 10px; display: flex; justify-content: space-around; z-index: 10; }
        .btn-upgrade { background: linear-gradient(135deg, #d4af37 0%, #aa8c2c 100%); color: #062319; border: none; padding: 8px 12px; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.3); transition: 0.2s; }
        .btn-upgrade:active { transform: scale(0.95); }
        #start-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(6, 35, 25, 0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; text-align: center; padding: 20px; }
        h1 { font-size: 24px; margin-bottom: 15px; color: #d4af37; text-shadow: 2px 2px 4px #000; }
        p { font-size: 14px; margin-bottom: 25px; line-height: 1.6; color: #e0e0e0; }
        .btn-start { background: linear-gradient(135deg, #d4af37 0%, #aa8c2c 100%); color: #062319; border: none; padding: 12px 30px; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    </style>
</head>
<body>
    <div id="game-container">
        <header>
            <div class="stat-box">🛡️ دژ: <span id="castle-hp">100</span></div>
            <div class="stat-box">💰 طلا: <span id="gold">50</span></div>
            <div class="stat-box">⚔️ موج: <span id="wave">1</span></div>
        </header>
        <div id="canvas-wrap">
            <canvas id="gameCanvas"></canvas>
            <div id="start-screen">
                <h1>مدافع دژ: نبرد بی‌پایان</h1>
                <p>با تیراندازی دقیق، مهاجمان را نابود کنید و از دژ مقدس دفاع کنید. طلا کسب کنید و قابلیت‌های دفاعی خود را ارتقا دهید.</p>
                <button class="btn-start" onclick="startGame()">شروع نبرد</button>
            </div>
        </div>
        <footer>
            <button class="btn-upgrade" onclick="upgradeBow()">تیروکمان (هزینه: <span id="cost-bow">30</span>)</button>
            <button class="btn-upgrade" onclick="upgradeWall()">استحکام دژ (هزینه: <span id="cost-wall">50</span>)</button>
        </footer>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let gameState = {
            hp: 100,
            maxHp: 100,
            gold: 50,
            wave: 1,
            bowLevel: 1,
            bowCost: 30,
            wallCost: 50,
            isPlaying: false
        };

        let enemies = [];
        let projectiles = [];
        let enemySpawnTimer = 0;

        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            gameState.isPlaying = true;
            loop();
        }

        canvas.addEventListener('click', (e) => {
            if (!gameState.isPlaying) return;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            // شلیک تیر به سمت محل کلیک
            projectiles.push({
                x: canvas.width / 2,
                y: canvas.height - 120,
                targetX: x,
                targetY: y,
                speed: 12,
                damage: 25 * gameState.bowLevel
            });
        });

        function upgradeBow() {
            if (gameState.gold >= gameState.bowCost) {
                gameState.gold -= gameState.bowCost;
                gameState.bowLevel++;
                gameState.bowCost = Math.floor(gameState.bowCost * 1.5);
                updateUI();
            }
        }

        function upgradeWall() {
            if (gameState.gold >= gameState.wallCost) {
                gameState.gold -= gameState.wallCost;
                gameState.maxHp += 50;
                gameState.hp = gameState.maxHp;
                gameState.wallCost = Math.floor(gameState.wallCost * 1.6);
                updateUI();
            }
        }

        function updateUI() {
            document.getElementById('castle-hp').innerText = gameState.hp;
            document.getElementById('gold').innerText = gameState.gold;
            document.getElementById('wave').innerText = gameState.wave;
            document.getElementById('cost-bow').innerText = gameState.bowCost;
            document.getElementById('cost-wall').innerText = gameState.wallCost;
        }

        function spawnEnemy() {
            enemies.push({
                x: Math.random() * (canvas.width - 60) + 30,
                y: -30,
                radius: 18,
                speed: 1 + gameState.wave * 0.2,
                hp: 40 + gameState.wave * 15,
                maxHp: 40 + gameState.wave * 15
            });
        }

        function update() {
            if (!gameState.isPlaying) return;

            enemySpawnTimer++;
            if (enemySpawnTimer > Math.max(30, 90 - gameState.wave * 5)) {
                spawnEnemy();
                enemySpawnTimer = 0;
            }

            // حرکت پروژکتیل‌ها
            for (let i = projectiles.length - 1; i >= 0; i--) {
                let p = projectiles[i];
                let dx = p.targetX - p.x;
                let dy = p.targetY - p.y;
                let dist = Math.hypot(dx, dy);
                if (dist < p.speed) {
                    // برخورد تیر
                    for (let j = enemies.length - 1; j >= 0; j--) {
                        let en = enemies[j];
                        if (Math.hypot(en.x - p.targetX, en.y - p.targetY) < en.radius + 10) {
                            en.hp -= p.damage;
                            if (en.hp <= 0) {
                                enemies.splice(j, 1);
                                gameState.gold += 15;
                                if (Math.random() < 0.1) gameState.wave++;
                            }
                        }
                    }
                    projectiles.splice(i, 1);
                } else {
                    p.x += (dx / dist) * p.speed;
                    p.y += (dy / dist) * p.speed;
                }
            }

            // حرکت دشمنان
            for (let i = enemies.length - 1; i >= 0; i--) {
                let en = enemies[i];
                en.y += en.speed;
                // رسیدن به دژ
                if (en.y > canvas.height - 100) {
                    gameState.hp -= 10;
                    enemies.splice(i, 1);
                    if (gameState.hp <= 0) {
                        gameState.hp = 0;
                        gameState.isPlaying = false;
                        alert('دژ سقوط کرد! بازی به پایان رسید.');
                        location.reload();
                    }
                }
            }
            updateUI();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // ترسیم پس‌زمینه و دژ
            ctx.fillStyle = '#062d20';
            ctx.fillRect(0, canvas.height - 100, canvas.width, 100);
            ctx.fillStyle = '#d4af37';
            ctx.font = 'bold 16px Tahoma';
            ctx.textAlign = 'center';
            ctx.fillText('🏰 حصار دژ مقدس', canvas.width / 2, canvas.height - 45);

            // ترسیم تیرها
            ctx.fillStyle = '#d4af37';
            projectiles.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
                ctx.fill();
            });

            // ترسیم دشمنان
            enemies.forEach(en => {
                ctx.fillStyle = '#b33939';
                ctx.beginPath();
                ctx.arc(en.x, en.y, en.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#d4af37';
                ctx.lineWidth = 2;
                ctx.stroke();

                // نوار جان دشمن
                ctx.fillStyle = '#000';
                ctx.fillRect(en.x - 20, en.y - 28, 40, 6);
                ctx.fillStyle = '#2ecc71';
                ctx.fillRect(en.x - 20, en.y - 28, 40 * (en.hp / en.maxHp), 6);
            });
        }

        function loop() {
            update();
            draw();
            if (gameState.isPlaying) requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
